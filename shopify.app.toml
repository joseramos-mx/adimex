# Custom app para automatización SEO / catálogo vía Admin API.
#
# El client_id apunta a "ADIMEX SEO Automation" (creada en Dev Dashboard).
# La cart/checkout usa Storefront tokens administrados por la Sales Channel
# "Headless" nativa de Shopify — esta app NO toca ese flujo.
name = "ADIMEX SEO Automation"
client_id = "abf14979ce451a347fe091f3654f7b4c"
application_url = "https://adimex.io"
embedded = false

[auth]
redirect_urls = ["https://adimex.io/auth/callback"]

[access_scopes]
scopes = "read_products,write_products,read_content,write_content,read_inventory,write_inventory"
use_legacy_install_flow = false

[webhooks]
api_version = "2026-07"
